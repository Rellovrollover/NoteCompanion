<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>NoteCompanion</title>
<meta name="description" content="Notes, captures and PDFs across all your devices, offline first, synced through your own OneDrive.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NoteCompanion">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="stylesheet" href="./css/app.css">
<script>try{var t=localStorage.getItem('nc-theme');if(t&&t!=='system')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="btn-menu" type="button" aria-label="Notebooks" title="Notebooks">☰</button>
  <div class="navbtns">
    <button class="iconbtn nav" id="btn-back" type="button" aria-label="Back" title="Back"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="iconbtn nav" id="btn-fwd" type="button" aria-label="Forward" title="Forward"><svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M7.5 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <a class="brand" href="#inbox">NoteCompanion</a>
  <div class="navbtns edit">
    <button class="iconbtn nav" id="btn-undo" type="button" aria-label="Undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M8 7H4v4M4.5 11a8 8 0 1 1 1.6 6.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="iconbtn nav" id="btn-redo" type="button" aria-label="Redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M16 7h4v4M19.5 11a8 8 0 1 0-1.6 6.4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="topbar-spacer"></div>
  <button class="iconbtn nav" id="btn-reload" type="button" aria-label="Reload" title="Reload the app"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="syncpill" id="syncpill" type="button" title="Sync status">
    <span class="dot"></span><span class="label">Starting</span>
  </button>
</header>

<div class="shell">
  <nav class="sidebar" id="sidebar" aria-label="Notebooks">
    <div class="side-top">
      <a class="side-link" href="#inbox" data-nav="inbox"><span>Inbox</span><span class="count" id="inbox-count"></span></a>
      <a class="side-link" href="#search" data-nav="search"><span>Search</span></a>
      <a class="side-link" href="#pdfs" data-nav="pdfs"><span>PDF library</span></a>
      <a class="side-link" href="#apps" data-nav="apps"><span>Apps</span></a>
      <a class="side-link" href="#settings" data-nav="settings"><span>Settings</span></a>
    </div>
    <div class="tree" id="tree" aria-label="Notebook tree"></div>
    <div class="side-foot">
      <button class="textbtn" id="btn-new-notebook" type="button">+ Notebook</button>
    </div>
  </nav>
  <div class="scrim" id="scrim"></div>
  <main class="content" id="content" tabindex="-1"></main>
</div>

<nav class="tabbar" aria-label="Main">
  <a href="#inbox" data-nav="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h5l1.5 2.5h5L16 13h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 5h14l2 8v6H3v-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Inbox</span></a>
  <a href="#notes" data-nav="notes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5 17a2 2 0 0 1 2-2h12M9 8h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Notes</span></a>
  <a href="#search" data-nav="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 15l5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Search</span></a>
  <a href="#settings" data-nav="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h3M11 12h9M4 17h12M20 17h0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="18" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg><span>More</span></a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="sheet-host" id="sheet-host" hidden></div>
<input type="file" id="file-any" multiple hidden>
<input type="file" id="file-scan" accept="image/*" capture="environment" hidden>
<input type="file" id="file-pdf" accept="application/pdf,.pdf" multiple hidden>

<script src="./vendor/dexie.min.js"></script>
<script src="./vendor/msal-browser.min.js"></script>
<script src="./vendor/marked.js"></script>
<script src="./vendor/turndown.js"></script>
<script src="./vendor/tinymce/tinymce.min.js"></script>
<script src="./vendor/pdf-lib.min.js"></script>
<script type="module">import * as pdfjsLib from './vendor/pdfjs/pdf.min.mjs'; window.pdfjsLib = pdfjsLib;</script>
<script src="./js/config.js"></script>
<script src="./js/db.js"></script>
<script src="./js/graph.js"></script>
<script src="./js/sync.js"></script>
<script src="./js/pdf.js"></script>
<script src="./js/onenote.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
